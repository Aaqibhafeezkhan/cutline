name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, as a human editor or as an agent?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which operation / MCP tool / UI change would solve it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
